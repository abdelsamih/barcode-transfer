<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Barcode Transfer (MQTT relay)</title>
<style>
  body{font-family:system-ui,sans-serif;margin:0;padding:16px;background:#111;color:#eee}
  h1{font-size:1.15rem;margin:0 0 12px}
  .row{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap}
  button{padding:10px 14px;border-radius:8px;border:0;background:#3b82f6;color:#fff;font-size:1rem;cursor:pointer}
  button.secondary{background:#374151}
  input{padding:10px;border-radius:8px;border:1px solid #444;background:#222;color:#eee;flex:1;min-width:120px}
  #scanRegion{width:100%;max-width:420px;margin:12px 0;border-radius:12px;overflow:hidden}
  .status{font-size:.9rem;color:#9ca3af;margin:6px 0}
  .log{font-family:monospace;font-size:.85rem;background:#1f2937;padding:8px;border-radius:8px;max-height:200px;overflow:auto;white-space:pre-wrap}
  .big{font-size:1.4rem;font-weight:700;color:#34d399}
</style>
</head>
<body>
<h1>Barcode → Clipboard (MQTT relay)</h1>

<div class="row">
  <button id="hostBtn">I'm the iPad (Receive)</button>
  <button id="joinBtn" class="secondary">I'm the iPhone (Send)</button>
</div>

<div id="hostPanel" style="display:none">
  <p class="status">Room code: <span class="big" id="code"></span></p>
  <p class="status">Status: <span id="hstatus">connecting…</span></p>
  <p class="status">Last received: <span class="big" id="recv"></span></p>
  <div class="log" id="hlog"></div>
</div>

<div id="joinPanel" style="display:none">
  <div class="row">
    <input id="codeInput" placeholder="Enter room code from iPad">
    <button id="connectBtn">Connect</button>
  </div>
  <div id="scanRegion"></div>
  <p class="status">Status: <span id="jstatus">not connected</span></p>
  <p class="status">Last scanned: <span id="scanned"></span></p>
  <button id="testBtn" class="secondary">Send test message</button>
  <div class="log" id="jlog"></div>
</div>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
const hlog=m=>{const d=document.getElementById('hlog');d.textContent=m+"\n"+d.textContent};
const jlog=m=>{const d=document.getElementById('jlog');d.textContent=m+"\n"+d.textContent};

let client, room;

function connectMqtt(onReady){
  client=mqtt.connect('wss://broker.hivemq.com:8884/mqtt',{clientId:'bc-'+Math.random().toString(36).slice(2,10)});
  client.on('connect',()=>{ onReady(); });
  client.on('error',e=>{hlog('MQTT error: '+e); jlog('MQTT error: '+e)});
  client.on('reconnect',()=>{hlog('reconnecting…');jlog('reconnecting…')});
  client.on('message',(topic,msg)=>{
    if(document.getElementById('hostPanel').style.display!=='none'){
      const t=msg.toString();
      document.getElementById('recv').textContent=t;
      hlog('Received: '+t);
      navigator.clipboard.writeText(t).then(()=>hlog('Copied to clipboard')).catch(()=>hlog('Clipboard blocked'));
    }
  });
}

document.getElementById('hostBtn').onclick=()=>{
  document.getElementById('hostPanel').style.display='block';
  document.getElementById('joinPanel').style.display='none';
  room='bc-'+Math.random().toString(36).slice(2,8);
  document.getElementById('code').textContent=room;
  connectMqtt(()=>{
    document.getElementById('hstatus').textContent='connected (waiting for phone)';
    hlog('Connected to broker. Room: '+room);
    client.subscribe('barcodexfer/'+room,{qos:1},(err)=>{ if(err) hlog('Subscribe error: '+err); else hlog('Subscribed OK'); });
  });
};

document.getElementById('joinBtn').onclick=()=>{
  document.getElementById('joinPanel').style.display='block';
  document.getElementById('hostPanel').style.display='none';
};

document.getElementById('connectBtn').onclick=()=>{
  room=document.getElementById('codeInput').value.trim();
  if(!room){alert('Enter room code');return;}
  connectMqtt(()=>{
    document.getElementById('jstatus').textContent='connected';
    jlog('Connected to broker. Room: '+room);
    const qr=new Html5Qrcode('scanRegion');
    qr.start({facingMode:'environment'},{fps:10,qrbox:250},
      txt=>{
        document.getElementById('scanned').textContent=txt;
        jlog('Scanned: '+txt);
        client.publish('barcodexfer/'+room, txt, {qos:1},(err)=>{ if(err) jlog('Publish error: '+err); else jlog('Published OK'); });
      },()=>{}
    ).catch(e=>jlog('Camera error: '+e));
  });
};

document.getElementById('testBtn').onclick=()=>{
  if(!client||!room){jlog('Not connected');return;}
  const t='TEST-'+Date.now();
  client.publish('barcodexfer/'+room, t, {qos:1},(err)=>{ if(err) jlog('Publish error: '+err); else jlog('Published test: '+t); });
};
</script>
</body>
</html>
