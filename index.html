<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Barcode Transfer</title>
<style>
  body{font-family:system-ui,sans-serif;margin:0;padding:16px;background:#111;color:#eee}
  h1{font-size:1.2rem;margin:0 0 12px}
  .row{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap}
  button{padding:10px 14px;border-radius:8px;border:0;background:#3b82f6;color:#fff;font-size:1rem;cursor:pointer}
  button.secondary{background:#374151}
  input{padding:10px;border-radius:8px;border:1px solid #444;background:#222;color:#eee;flex:1;min-width:120px}
  #reader{width:100%;max-width:420px;margin:12px 0;border-radius:12px;overflow:hidden}
  .status{font-size:.9rem;color:#9ca3af;margin:6px 0}
  .log{font-family:monospace;font-size:.85rem;background:#1f2937;padding:8px;border-radius:8px;max-height:160px;overflow:auto;white-space:pre-wrap}
  .big{font-size:1.4rem;font-weight:700;color:#34d399}
</style>
</head>
<body>
<h1>Barcode → Clipboard Transfer</h1>

<div class="row">
  <button id="hostBtn">I'm the iPad (Receive)</button>
  <button id="joinBtn" class="secondary">I'm the iPhone (Send)</button>
</div>

<div id="hostPanel" style="display:none">
  <p class="status">Your room code: <span class="big" id="code"></span></p>
  <p class="status">Waiting for phone to connect…</p>
  <p class="status">Last received: <span class="big" id="recv"></span></p>
  <div class="log" id="log"></div>
</div>

<div id="joinPanel" style="display:none">
  <div class="row">
    <input id="codeInput" placeholder="Enter room code from iPad">
    <button id="connectBtn">Connect</button>
  </div>
  <div id="reader"></div>
  <p class="status" id="jstatus">Not connected</p>
  <p class="status">Last scanned: <span id="scanned"></span></p>
  <div class="log" id="jlog"></div>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
const log=(el,m)=>{const d=document.getElementById(el);d.textContent=m+"\n"+d.textContent};

let peer, conn;

document.getElementById('hostBtn').onclick=()=>{
  document.getElementById('hostPanel').style.display='block';
  document.getElementById('joinPanel').style.display='none';
  const id='bt-'+Math.random().toString(36).slice(2,8);
  peer=new Peer(id);
  peer.on('open',id=>{document.getElementById('code').textContent=id;log('log','Ready. Code: '+id)});
  peer.on('connection',c=>{
    conn=c;
    log('log','Phone connected');
    c.on('data',d=>{
      document.getElementById('recv').textContent=d;
      log('log','Received: '+d);
      // copy to clipboard
      navigator.clipboard.writeText(d).then(()=>log('log','Copied to clipboard')).catch(()=>log('log','Clipboard blocked; tap to copy'));
    });
    c.on('close',()=>log('log','Disconnected'));
  });
  peer.on('error',e=>log('log','Error: '+e));
};

document.getElementById('joinBtn').onclick=()=>{
  document.getElementById('joinPanel').style.display='block';
  document.getElementById('hostPanel').style.display='none';
  peer=new Peer();
  peer.on('open',id=>log('jlog','Ready as sender: '+id));
  peer.on('error',e=>log('jlog','Error: '+e));
};

document.getElementById('connectBtn').onclick=()=>{
  const code=document.getElementById('codeInput').value.trim();
  if(!code){alert('Enter code');return;}
  conn=peer.connect(code);
  conn.on('open',()=>{document.getElementById('jstatus').textContent='Connected';log('jlog','Connected to iPad')});
  conn.on('error',e=>log('jlog','Error: '+e));
  startScan();
};

function startScan(){
  const qr=new Html5Qrcode('reader');
  qr.start({facingMode:'environment'},{fps:10,qrbox:250},
    txt=>{
      document.getElementById('scanned').textContent=txt;
      log('jlog','Scanned: '+txt);
      if(conn && conn.open){ conn.send(txt); log('jlog','Sent'); }
    },
    err=>{}
  ).catch(e=>log('jlog','Camera error: '+e));
}
</script>
</body>
</html>
